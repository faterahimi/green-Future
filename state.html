<div class="w-80 bg-white rounded-2xl shadow-md overflow-hidden">

  <!-- Image -->
  <div class="relative">

    <img
      src="shoes.jpg"
      class="w-full h-64 object-cover"
      alt="Running shoes"
    />

    <!-- Favorite -->
    <button
      class="absolute top-3 right-3
             w-10 h-10
             bg-white rounded-full
             shadow-md
             flex items-center justify-center
             hover:bg-gray-100"
    >

      <!-- Heart SVG -->
      <svg
        class="w-5 h-5 text-gray-700"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <!-- path -->
      </svg>

    </button>

    <!-- Sale -->
    <span
      class="absolute top-3 left-3
             bg-rose-600 text-white
             px-3 py-1
             rounded-full text-xs font-semibold"
    >
      SALE
    </span>

  </div>


  <!-- Content -->
  <div class="p-5">

    <!-- Rating -->
    <div class="flex items-center gap-1">

      <svg
        class="w-4 h-4 text-yellow-400 fill-current"
        viewBox="0 0 20 20"
      >
        <!-- star path -->
      </svg>

      <span class="text-sm text-gray-500">
        4.8 (124)
      </span>

    </div>


    <!-- Product -->
    <h2 class="text-xl font-bold mt-2">
      Urban Running Shoes
    </h2>

    <p class="text-gray-500 text-sm mt-1">
      Lightweight shoes for everyday running.
    </p>


    <!-- Price -->
    <div class="flex items-center gap-3 mt-4">

      <span class="text-gray-400 line-through">
        $120
      </span>

      <span class="text-2xl font-bold text-rose-600">
        $96
      </span>

    </div>


    <!-- Colors -->
    <div class="mt-4">

      <p class="text-sm font-semibold mb-2">
        Color
      </p>

      <div class="flex gap-2">

        <button
          class="w-6 h-6 rounded-full
                 bg-black ring-2 ring-gray-900 ring-offset-2">
        </button>

        <button
          class="w-6 h-6 rounded-full
                 bg-blue-600">
        </button>

        <button
          class="w-6 h-6 rounded-full
                 bg-red-600">
        </button>

      </div>

    </div>


    <!-- Cart -->
    <button
      class="w-full mt-5
             flex items-center justify-center gap-2
             bg-gray-900 text-white
             py-3
             rounded-lg
             hover:bg-gray-700
             transition"
    >

      <!-- Cart icon -->

      <svg
        class="w-5 h-5"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <!-- path -->
      </svg>

      Add to Cart

    </button>

  </div>

</div>
